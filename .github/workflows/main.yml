name: AI Agent Pipeline CI/CD

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # This spins up a fresh, isolated Linux server on GitHub
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code onto the GitHub server
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Install Python
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # Step 3: Install dependencies exactly as they are on your machine
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8

    # Step 4: Enforce formatting (will fail if code isn't formatted)
    - name: Check code formatting with Black
      run: |
        black --check src tests

    # Step 5: Check for syntax/logic errors
    - name: Lint with Flake8
      run: |
        flake8 src tests --max-line-length=120

   # Step 6: Run the unit tests to mathematically prove the pipeline works
    - name: Run unit tests
      env:
        # This securely injects the secrets into the runner environment
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        MODEL_NAME: ${{ secrets.MODEL_NAME }}
      run: |
        pytest tests/ -v