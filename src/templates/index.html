<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Pipeline | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-3xl w-full bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
        
        <!-- Header -->
        <div class="border-b border-gray-700 p-8 bg-gray-800/50">
            <h1 class="text-3xl font-bold text-white mb-2">AI Agent Pipeline</h1>
            <p class="text-emerald-400 font-mono text-sm">Production AI Engineering Demonstration</p>
        </div>

        <div class="p-8 space-y-8">
            <!-- Features Grid -->
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 font-mono text-sm">
                <div class="flex items-center space-x-2"><span class="text-emerald-500">✓</span><span>Token Optimization</span></div>
                <div class="flex items-center space-x-2"><span class="text-emerald-500">✓</span><span>Multi-Agent Workflow</span></div>
                <div class="flex items-center space-x-2"><span class="text-emerald-500">✓</span><span>Debugging Dashboard</span></div>
                <div class="flex items-center space-x-2"><span class="text-emerald-500">✓</span><span>CI/CD Setup</span></div>
                <div class="flex items-center space-x-2"><span class="text-emerald-500">✓</span><span>Production Logging</span></div>
                <div class="flex items-center space-x-2"><span class="text-emerald-500">✓</span><span>Cloud Deployment</span></div>
            </div>

            <!-- Metrics Box -->
            <div class="bg-gray-900 p-6 rounded-lg border border-gray-700">
                <div class="grid grid-cols-2 gap-y-4 text-sm font-mono">
                    <div class="text-gray-400">Original Tokens</div>
                    <div class="text-right text-red-400">~100,000</div>
                    
                    <div class="text-gray-400">Optimized Tokens</div>
                    <div class="text-right text-emerald-400">~400</div>
                    
                    <div class="col-span-2 border-t border-gray-700 my-2"></div>
                    
                    <div class="text-gray-400">Reduction</div>
                    <div class="text-right font-bold text-emerald-400">99.5%</div>
                    
                    <div class="text-gray-400">Estimated Cost</div>
                    <div class="text-right text-gray-300"><span class="line-through text-red-400/70 mr-2">$0.50</span><$0.01</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">
                <a href="/docs" class="text-center bg-emerald-600 hover:bg-emerald-500 text-white py-2 px-4 rounded font-medium transition-colors">Run Demo</a>
                <a href="/logs" target="_blank" class="text-center bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded font-medium transition-colors border border-gray-600">View Logs</a>
                <a href="https://github.com/raoopriyanka/ai_agent_pipeline" target="_blank" class="text-center bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded font-medium transition-colors border border-gray-600">GitHub</a>
            </div>
        </div>
    </div>
</body>
</html>
